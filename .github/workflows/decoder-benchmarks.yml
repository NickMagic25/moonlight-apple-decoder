name: Decoder hardware comparison

# Run only after reviewing both revisions. Never attach this job to a PR event:
# CMake, Python, and decoder code execute directly on the physical runner.
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full 40-character SHA of a reviewed baseline commit in this repository
        required: true
        type: string
      configuration:
        description: Reviewed YAML path in the selected candidate branch
        required: true
        default: benchmarks/full-matrix.yaml
        type: string

permissions:
  contents: read

# A single device must never benchmark two revisions or jobs concurrently.
concurrency:
  group: decoder-hardware-comparison
  cancel-in-progress: false

jobs:
  compare:
    name: Paired physical VideoToolbox comparison
    runs-on: [self-hosted, macOS, ARM64, moonlight-video]
    timeout-minutes: 120
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CONFIGURATION: ${{ inputs.configuration }}
      MAV_AOMENC: ${{ vars.MAV_AOMENC }}
      MAV_DEVELOPER_DIR: ${{ vars.MAV_DEVELOPER_DIR }}
    steps:
      - name: Check out the selected candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate inputs and physical runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["BASELINE_SHA"]):
              raise SystemExit("baseline_sha must be a full 40-character commit SHA")
          root = pathlib.Path.cwd().resolve()
          config = (root / os.environ["CONFIGURATION"]).resolve()
          if not config.is_relative_to(root) or config.suffix not in (".yaml", ".yml") or not config.is_file():
              raise SystemExit("configuration must name an existing YAML file inside the candidate checkout")
          PY
          if [[ -n "$MAV_DEVELOPER_DIR" ]]; then
            printf 'DEVELOPER_DIR=%s\n' "$MAV_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          aomenc_path="$MAV_AOMENC"
          if [[ -z "$aomenc_path" ]]; then
            aomenc_path="$(command -v aomenc || true)"
          fi
          if [[ ! -x "$aomenc_path" ]]; then
            echo 'Set repository variable MAV_AOMENC to a preinstalled aomenc executable, or put it on PATH.' >&2
            exit 1
          fi
          printf 'AOMENC=%s\n' "$aomenc_path" >> "$GITHUB_ENV"
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
      - name: Check out the reviewed baseline commit separately
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline_sha }}
          path: .local/ci-baseline
          persist-credentials: false
      - name: Install benchmark parser dependency
        run: python -m pip install --requirement scripts/requirements-benchmarks.txt
      - name: Test YAML configuration and comparison runner before building
        run: python -m unittest discover -s tests -p 'benchmark_*.py' -v
      - name: Validate example configurations without hardware
        run: |
          for configuration in benchmarks/*.yaml; do
            python scripts/compare-decoders.py --config "$configuration" --dry-run
          done
      - name: Capture build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/hardware-build
          {
            git rev-parse HEAD
            git -C .local/ci-baseline rev-parse HEAD
            xcodebuild -version
            xcrun clang --version
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-version
            cmake --version
            pmset -g batt
          } > results/hardware-build/provenance.log
          "$AOMENC" --help > results/hardware-build/aomenc-help.txt
      - name: Configure and build baseline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .local/ci-baseline -B build-ci-baseline \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DMAV_BUILD_TOOLS=ON -DMAV_VT_EXPERIMENTS=OFF -DMAV_SANITIZE=OFF \
            2>&1 | tee results/hardware-build/baseline-configure.log
          cmake --build build-ci-baseline --parallel 3 2>&1 | tee results/hardware-build/baseline-build.log
          ctest --test-dir build-ci-baseline --output-on-failure --output-junit "$PWD/build-ci-baseline/ctest.xml" \
            2>&1 | tee results/hardware-build/baseline-test.log
      - name: Configure and build candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-ci-candidate \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DMAV_BUILD_TOOLS=ON -DMAV_VT_EXPERIMENTS=OFF -DMAV_SANITIZE=OFF \
            2>&1 | tee results/hardware-build/candidate-configure.log
          cmake --build build-ci-candidate --parallel 3 2>&1 | tee results/hardware-build/candidate-build.log
          ctest --test-dir build-ci-candidate --output-on-failure --output-junit "$PWD/build-ci-candidate/ctest.xml" \
            2>&1 | tee results/hardware-build/candidate-test.log
          swift run -c release mav-swift-smoke 2>&1 | tee results/hardware-build/swift-smoke.log
      - name: Verify bitrate, HDR, GOP, and imported fixture provenance before timing
        shell: bash
        run: |
          set -euo pipefail
          MAV_FIXTURE_TOOL=build-ci-candidate/mav-fixture python tests/benchmark_process_tests.py \
            2>&1 | tee results/hardware-build/encoder-timeout.log
          python tests/fixture_generation.py \
            --tool build-ci-candidate/mav-fixture --aomenc "$AOMENC" \
            --results-dir results/fixture-generation \
            2>&1 | tee results/hardware-build/fixture-generation.log
      - name: Prepare fixtures and run serial paired comparison
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare-decoders.py \
            --config "$CONFIGURATION" \
            --candidate-build build-ci-candidate \
            --baseline-build build-ci-baseline \
            --fixture-build build-ci-candidate \
            --candidate-revision "$GITHUB_SHA" \
            --baseline-revision "$BASELINE_SHA" \
            --aomenc "$AOMENC" \
            --results-dir results/hardware
      - name: Publish comparison report in the job summary
        if: always()
        shell: bash
        run: |
          if [[ -f results/hardware/report.md ]]; then
            cat results/hardware/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve fixtures, raw measurements, reports, and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-hardware-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/hardware/
            results/hardware-build/
            results/fixture-generation/
            build-ci-baseline/CMakeCache.txt
            build-ci-baseline/compile_commands.json
            build-ci-baseline/ctest.xml
            build-ci-baseline/Testing/Temporary/
            build-ci-candidate/CMakeCache.txt
            build-ci-candidate/compile_commands.json
            build-ci-candidate/ctest.xml
            build-ci-candidate/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 30
