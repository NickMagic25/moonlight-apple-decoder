name: Decoder tests

on:
  pull_request:
    paths:
      - '.github/workflows/decoder-tests.yml'
      - 'CMakeLists.txt'
      - 'Package.swift'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benchmarks/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/decoder-tests.yml'
      - 'CMakeLists.txt'
      - 'Package.swift'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benchmarks/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decoder-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select the validated Apple toolchain
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install benchmark parser dependency
        run: python -m pip install --requirement scripts/requirements-benchmarks.txt
      - name: Test YAML configuration and comparison runner
        run: python -m unittest discover -s tests -p 'benchmark_*.py' -v
      - name: Validate example configurations without hardware
        run: |
          for configuration in benchmarks/*.yaml; do
            python scripts/compare-decoders.py --config "$configuration" --dry-run
          done
      - name: Configure portable native tests with assertions enabled
        shell: bash
        run: |
          MAV_TOOLS_ENABLED=OFF
          if [[ "$RUNNER_OS" == macOS ]]; then
            MAV_TOOLS_ENABLED=ON
          fi
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DMAV_BUILD_TOOLS="$MAV_TOOLS_ENABLED" -DMAV_VT_EXPERIMENTS=OFF
      - name: Build portable native tests
        run: cmake --build build-ci --parallel 3
      - name: Run portable native tests
        run: ctest --test-dir build-ci --output-on-failure --output-junit "$PWD/build-ci/ctest.xml"
      - name: Verify native fixture encoder timeout cleanup without decode hardware
        if: runner.os == 'macOS'
        shell: bash
        run: |
          MAV_FIXTURE_TOOL=build-ci/mav-fixture python tests/benchmark_process_tests.py \
            2>&1 | tee build-ci/encoder-timeout.log
      - name: Verify Swift 6.3 package and Swift 6 C ABI smoke
        if: runner.os == 'macOS'
        run: |
          swift --version
          swift run -c debug mav-swift-smoke
      - name: Preserve native test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-tests-${{ matrix.os }}
          path: |
            build-ci/ctest.xml
            build-ci/Testing/Temporary/
            build-ci/CMakeCache.txt
            build-ci/encoder-timeout.log
          if-no-files-found: ignore
          retention-days: 14
